services:
  postgres:
    image: postgres:16-alpine
    container_name: everest-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: everest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: everest-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      start_period: 10s

  # Create default bucket on startup
  minio-init:
    image: minio/mc:latest
    container_name: everest-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/documents --ignore-existing;
      mc anonymous set public myminio/documents;
      exit 0;
      "

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: everest-backend
    environment:
      APP_NAME: everest
      PORT: "8080"
      LOG_LEVEL: debug
      CORS_ORIGINS: http://frontend:5173
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/everest?sslmode=disable
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: documents
      MINIO_USE_SSL: "false"
      AI_TAGGER_ENABLED: "true"
      AI_TAGGER_MODEL: "openai/gpt-4o-mini"
      ZITADEL_ISSUER: http://zitadel-proxy:80
      ZITADEL_CLIENT_ID: ${ZITADEL_CLIENT_ID:-374300525723648003}
      ZITADEL_SKIP_AUTH: ${ZITADEL_SKIP_AUTH:-true}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # healthcheck omitted — local dev only

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: everest-frontend
    environment:
      VITE_API_URL: http://backend:8080
    ports:
      - "5173:5173"
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
      - ./web/index.html:/app/index.html
      - ./web/vite.config.ts:/app/vite.config.ts
      - ./web/tsconfig.json:/app/tsconfig.json
      - ./web/tsconfig.app.json:/app/tsconfig.app.json
      - ./web/tsconfig.node.json:/app/tsconfig.node.json
    depends_on:
      - backend

  bifrost:
    image: maximhq/bifrost:latest
    container_name: everest-bifrost
    ports:
      - "8081:8080"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - bifrost_data:/app/data
      - ./bifrost-config.json:/app/data/config.json:ro

  zitadel-postgres:
    image: postgres:17.2-alpine
    container_name: everest-zitadel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zitadel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d zitadel -U postgres"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 20s
    volumes:
      - zitadel_postgres_data:/var/lib/postgresql/data
    networks:
      - zitadel
    profiles:
      - zitadel

  zitadel-proxy:
    image: traefik:v3.6.8
    container_name: everest-zitadel-proxy
    restart: unless-stopped
    profiles:
      - zitadel
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=everest-zitadel
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --ping=true
      - --ping.entrypoint=web
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "8082:80"
    networks:
      - zitadel
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      zitadel-api:
        condition: service_healthy
      zitadel-login:
        condition: service_healthy

  zitadel-api:
    image: ghcr.io/zitadel/zitadel:v4.13.0
    container_name: everest-zitadel-api
    restart: unless-stopped
    profiles:
      - zitadel
    user: "0"
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY:-MasterkeyNeedsToHave32Characters}"
    environment:
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_DOMAIN:-localhost}

volumes:
  postgres_data:
  minio_data:
  bifrost_data:
